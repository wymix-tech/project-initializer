# 元数据配置：Java 版本、Boot 官方版本、兼容矩阵（ID 引用成有向图）
# 修改本文件即可调整版本联动规则，无需改动代码
javaVersions:
  - id: "8"
    label: "Java 8"
    deprecated: false
    recommendedBootVersion: "2.7.18"
  - id: "11"
    label: "Java 11"
    deprecated: false
    recommendedBootVersion: "2.7.18"
  - id: "17"
    label: "Java 17"
    deprecated: false
    recommendedBootVersion: "3.2.5"
  - id: "21"
    label: "Java 21"
    deprecated: false
    recommendedBootVersion: "3.2.5"

bootVersions:
  - id: "2.7.18"
    label: "Spring Boot 2.7.18"
    official: true
    supportedJavaVersions: ["8", "11"]
    # 该 Boot 版本可引用的 starter（白名单）；省略/为空时即对全部清单条目可选
    starters: ["web", "data-jpa", "data-redis", "actuator", "xxx-redis-spring-boot-starter"]
  - id: "3.2.5"
    label: "Spring Boot 3.2.5"
    official: true
    supportedJavaVersions: ["17", "21"]
    starters: ["web", "data-jpa", "data-redis", "actuator", "xxx-redis-spring-boot-starter"]

# starter 元信息（展示名 / 依赖坐标 / 是否必选 / 依赖联动）全部由 catalog/starters/*.yml 提供，
# 平台装载时自动合并（merge），本文件不再维护 starters 节
