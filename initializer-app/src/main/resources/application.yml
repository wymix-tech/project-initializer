server:
  port: 8080

spring:
  application:
    name: project-initializer
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  datasource:
    # M3.1 持久化接线：管理端配置存储（文件 H2，可替换为任意 JDBC 数据源）
    url: jdbc:h2:file:./data/initializer;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

initializer:
  admin:
    # 管理端内置管理员 token（M3.1 轻量鉴权；生产环境通过环境变量覆盖）
    token: ${INITIALIZER_ADMIN_TOKEN:admin-dev-token}
  sync:
    # 制品库同步（M3.3）：Mock fixture 路径与 remote 接口配置化；remote 未配置时仅 Mock 通道生效
    mock:
      fixture: ${INITIALIZER_SYNC_MOCK_FIXTURE:classpath:sync/artifact-repo-fixtures.yml}
    remote:
      endpoint: ${INITIALIZER_SYNC_REMOTE_ENDPOINT:}
      token: ${INITIALIZER_SYNC_REMOTE_TOKEN:}
    schedule:
      # 定时同步开关（默认关闭；开启后按 fixed-delay-ms 间隔全通道同步）
      enabled: ${INITIALIZER_SYNC_SCHEDULE_ENABLED:false}
      fixed-delay-ms: ${INITIALIZER_SYNC_SCHEDULE_DELAY:300000}
