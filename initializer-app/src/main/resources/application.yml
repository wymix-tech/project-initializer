server:
  port: 8080

spring:
  application:
    name: project-initializer
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  datasource:
    # M3.1 持久化接线：管理端配置存储（文件 H2，可替换为任意 JDBC 数据源）
    url: jdbc:h2:file:./data/initializer;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

initializer:
  catalog:
    # 外部清单目录（jar 外维护配置）：目录下放置 metadata.yml / starters/*.yml /
    # conflict-rules.yml / templates/** / validation.yml，格式正确即生效（重启生效），
    # 无需在管理端发布，也不与内置清单做一致性校验；starters 条目无需在 metadata.yml 登记。
    # 留空时默认使用 jar 所在目录下的 catalog/ 目录；目录不存在则回退内置/管理端配置。
    dir: ${INITIALIZER_CATALOG_DIR:}
  # 内置清单开关：仅当 jar 启动携带 --demo 时加载 classpath 内置清单（Java/Boot/starter）并播种。
  # 该值由 InitializerApplication#main 依据 --demo 以 system property 覆盖（优先级更高），
  # 故生产启动不带 --demo 时为空清单，数据全部由管理端发布提供；
  # 此处默认 true 仅服务于未经过 main 的测试与 IDE 直跑场景，保持既有测试行为不变。
  demo:
    enabled: true
  admin:
    # 管理端内置管理员 token（M3.1 轻量鉴权；生产环境通过环境变量覆盖）
    token: ${INITIALIZER_ADMIN_TOKEN:admin-dev-token}
  sync:
    # 制品库同步（M3.3）：Mock 仅在显式开启时启用；remote 通过 endpoint 配置启用
    mock:
      enabled: ${INITIALIZER_SYNC_MOCK_ENABLED:false}
      fixture: ${INITIALIZER_SYNC_MOCK_FIXTURE:classpath:sync/artifact-repo-fixtures.yml}
    remote:
      endpoint: ${INITIALIZER_SYNC_REMOTE_ENDPOINT:}
      token: ${INITIALIZER_SYNC_REMOTE_TOKEN:}
    schedule:
      # 定时同步开关（默认关闭；开启后按 fixed-delay-ms 间隔全通道同步）
      enabled: ${INITIALIZER_SYNC_SCHEDULE_ENABLED:false}
      fixed-delay-ms: ${INITIALIZER_SYNC_SCHEDULE_DELAY:300000}
